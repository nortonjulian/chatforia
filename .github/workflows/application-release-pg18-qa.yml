name: Combined application release PostgreSQL 18 verification

# Synthetic disposable service only. This workflow never deploys or uses secrets.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/application-release-pg18-qa.yml'
      - '.github/workflows/deploy-backend.yml'
      - 'server/prisma/**'
      - 'server/security/applicationMigrationRelease.v*.json'
      - 'server/security/disableMfa.js'
      - 'server/security/enrollMfa.js'
      - 'server/security/db-qa/mfa-disable.mjs'
      - 'server/scripts/application-release-*'
      - 'server/scripts/deploy-systemd-api*'
      - 'server/scripts/systemd-release-unit*'
      - 'server/scripts/migration-package*'
      - 'server/scripts/deploy-migration-package.mjs'
      - 'server/scripts/staff-migration-161.test.mjs'
      - 'server/scripts/staff-pg18-reconciliation-ci.mjs'
      - 'server/scripts/staff-stage5-recovery-pg18.test.mjs'
      - 'server/routes/**'
      - 'server/jobs/voicemailEmailDispatcher.js'

permissions:
  contents: read

jobs:
  application-release-pg18:
    name: Disposable PG18 v2-to-v3 migration, grants, and combined callbacks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: application_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: chatforia_application_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U application_ci -d chatforia_application_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://application_ci:synthetic_ci_only@127.0.0.1:5432/chatforia_application_release_test
      TEST_DATABASE_URL: postgresql://application_ci:synthetic_ci_only@127.0.0.1:5432/chatforia_application_release_test
      APPLICATION_RELEASE_SYNTHETIC_PG18: 'yes'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify manual deployment workflow safety boundaries
        run: node --test server/scripts/deploy-systemd-api.test.mjs server/scripts/deploy-systemd-api-operator.test.mjs server/scripts/systemd-release-unit.test.mjs
      - name: Bootstrap only the fresh disposable database
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$CI_POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U application_ci -d chatforia_application_release_test < server/scripts/application-release-ci-bootstrap.sql
          docker exec -i "$CI_POSTGRES_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U application_ci -d chatforia_application_release_test < server/scripts/staff-access-bootstrap-role.sql
      - name: Rehearse exact 161-to-164 and proposed 164-to-165 transitions
        run: node server/scripts/application-release-pg18-qa.mjs
      - name: Verify MFA disable policy and runtime database protections
        run: |
          npm install --prefix /tmp/mfa-test-driver --no-audit --no-fund pg@8.16.3
          NODE_PATH=/tmp/mfa-test-driver/node_modules MFA_TEST_ADMIN_URL="$DATABASE_URL" node server/security/db-qa/mfa-disable.mjs
          npm run -w server test:server -- --coverage=false --runInBand --runTestsByPath __tests__/mfa.enrollment.test.js __tests__/auth.mfaTotp.test.js
      - name: Run affected SMS, quiet-hours, and voicemail tests
        run: npm run -w server test:server -- --coverage=false --watchman=false --runInBand --runTestsByPath __tests__/sms.test.js services/__tests__/badgeState.test.js __tests__/smsWebhooks.test.js __tests__/voiceWebhooks.test.js __tests__/settings.forwarding.test.js services/__tests__/forwardingService.test.js utils/__tests__/forwardingQuietHours.test.js __tests__/voicemailForwardingWebhook.test.js jobs/__tests__/voicemailEmailDispatcher.test.js services/__tests__/voicemailEmail.test.js
