name: Prisma migration history

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-history:
    name: Append-only Prisma migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject changes to SQL already on main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          # Compare the proposed merge tree with its base, including base-only history.
          # Disabling rename detection exposes moved files as deletions.
          git diff --exit-code --name-status --no-renames --diff-filter=a "$BASE_SHA" "$MERGE_SHA" -- ':(glob)server/prisma/migrations/**/migration.sql'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies for recovery preflight tests
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run -w server prisma:generate
      - name: Verify release packaging and evidence checks
        run: node --test server/scripts/migration-package.test.mjs server/scripts/staff-migration-161.test.mjs server/scripts/mfa-165-recovery.test.mjs
      - name: Build proposed package from committed bytes
        run: node server/scripts/migration-package.mjs HEAD /tmp/migration-package.json
