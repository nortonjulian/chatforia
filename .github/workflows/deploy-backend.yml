name: Deploy Chatforia Backend (restricted systemd)

# Manual activation only, after a separately approved and verified migration
# package. This workflow does not create roles, run migrations, or use PM2.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed commit SHA already on main
        required: true
        type: string
      package_sha256:
        description: Independently reviewed migration package SHA-256
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production-api
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact main commit, approved application release, and package checksum
        env:
          RELEASE_COMMIT: ${{ inputs.commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          node -e 'const m=require("./server/security/applicationMigrationRelease.v3.json"); if(m.status!=="approved-for-production") process.exit(1)'
          node server/scripts/migration-package.mjs "$RELEASE_COMMIT" /tmp/chatforia-api-package.json
          test "$(sha256sum /tmp/chatforia-api-package.json | cut -d' ' -f1)" = "$PACKAGE_SHA256"
      - name: Use pinned SSH identity and run guarded systemd deployment
        env:
          API_HOST: ${{ secrets.API_DO_HOST }}
          API_USER: ${{ secrets.API_DO_USER }}
          API_SSH_KEY: ${{ secrets.API_DO_SSH_KEY }}
          API_KNOWN_HOSTS: ${{ secrets.API_DO_SSH_KNOWN_HOSTS }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          test -n "$API_HOST" && test -n "$API_USER" && test -n "$API_SSH_KEY" && test -n "$API_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$API_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$API_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            "$API_USER@$API_HOST" bash -se -- "$RELEASE_COMMIT" "$PACKAGE_SHA256" \
            < server/scripts/deploy-systemd-api.sh
