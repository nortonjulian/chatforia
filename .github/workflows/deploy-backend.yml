name: Deploy Chatforia Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.API_DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.API_DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy backend on droplet
        run: |
          ssh ${{ secrets.API_DO_USER }}@${{ secrets.API_DO_HOST }} << 'EOF'
            set -e
            cd /var/www/chatforia-api

            git fetch origin

            # Runtime uploads must never be changed by deployment.
            if [ -n "$(git diff --name-only HEAD origin/main -- server/uploads/)" ]; then
              echo "STOP: Deployment would change tracked upload files."
              exit 1
            fi

            # Do not overwrite locally modified tracked upload files.
            if [ -n "$(git status --porcelain --untracked-files=no -- server/uploads/)" ]; then
              echo "STOP: Production has locally modified tracked upload files."
              exit 1
            fi

            # Do not overwrite local production changes outside runtime uploads.
            if [ -n "$(git status --porcelain --untracked-files=normal -- . ":(exclude)server/uploads/")" ]; then
              echo "STOP: Production checkout has local changes."
              exit 1
            fi

            # Preserve runtime uploads during cleanup.
            git reset --hard origin/main
            git clean -fd -e server/uploads/

            npm install
            npx prisma generate --schema=server/prisma/schema.prisma
            npx prisma migrate deploy --schema=server/prisma/schema.prisma
            pm2 reload chatforia-api
          EOF